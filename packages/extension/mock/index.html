<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Mock Flow (FlowForge test page)</title>
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; background: #101114; color: #e8e8ea; display: grid; grid-template-columns: 1fr 340px; height: 100vh; }
  main { display: grid; grid-template-rows: auto 1fr auto; min-height: 0; border-right: 1px solid #2a2b31; }
  header { padding: 10px 14px; border-bottom: 1px solid #2a2b31; display: flex; gap: 8px; align-items: center; }
  #log { overflow: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 80%; padding: 8px 12px; border-radius: 10px; background: #1d1f25; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: #2b3550; }
  .msg img, .msg video { width: 300px; display: block; margin-top: 6px; border-radius: 6px; }
  footer { padding: 10px 14px; border-top: 1px solid #2a2b31; }
  .composer { display: flex; gap: 8px; align-items: flex-end; }
  [contenteditable] { flex: 1; min-height: 44px; padding: 10px; border-radius: 10px; background: #1d1f25; outline: none; white-space: pre-wrap; }
  button { background: #2b2d35; color: #eee; border: 1px solid #3a3c45; border-radius: 8px; padding: 8px 12px; cursor: pointer; }
  button:disabled { opacity: .4; }
  .chips { display: flex; gap: 6px; margin-bottom: 6px; }
  .chips img { width: 48px; height: 48px; object-fit: cover; border-radius: 6px; }
  aside { overflow: auto; padding: 10px; }
  aside .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  aside img, aside video { width: 100%; border-radius: 4px; }
</style>
</head>
<body>
<main>
  <header>
    <b>Mock Flow</b>
    <span style="opacity:.6">Behaves like Flow's agent chat for testing. Keywords: forbidden, ratelimit, captcha, noimage, approve, unusual, slow.</span>
    <button aria-label="Start new session" id="newSession" style="margin-left:auto">New session</button>
  </header>
  <div id="log"></div>
  <footer>
    <div class="chips" id="chips"></div>
    <div class="composer">
      <button aria-label="Add image" id="attach">+</button>
      <input type="file" id="file" accept="image/*" multiple hidden />
      <div contenteditable="true" role="textbox" id="composer" aria-label="Describe what you want to create"></div>
      <button aria-label="Start generation" id="go">Generate</button>
    </div>
  </footer>
</main>
<aside><b>Project</b><div class="grid" id="grid"></div></aside>
<script>
const $ = (id) => document.getElementById(id);
const log = $('log'), composer = $('composer'), go = $('go'), grid = $('grid'), chips = $('chips');
let attached = [];
let stopBtn = null;

function msg(text, cls = '') {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = 1e9;
  return d;
}
$('newSession').onclick = () => { log.innerHTML = ''; attached = []; chips.innerHTML = ''; };
$('attach').onclick = () => $('file').click();
$('file').onchange = (e) => {
  for (const f of e.target.files) {
    attached.push(f);
    const img = document.createElement('img');
    img.src = URL.createObjectURL(f);
    chips.appendChild(img);
  }
};
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function dims(text) {
  const m = /(16:9|9:16|1:1|4:3|3:4)/.exec(text);
  const r = m ? m[1] : '16:9';
  return { '16:9': [1024, 576], '9:16': [576, 1024], '1:1': [768, 768], '4:3': [960, 720], '3:4': [720, 960] }[r];
}

function paint(ctx, w, h, label, t = 0) {
  const g = ctx.createLinearGradient(0, 0, w, h);
  g.addColorStop(0, `hsl(${(label.length * 37 + t * 40) % 360},60%,45%)`);
  g.addColorStop(1, '#111');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#fff';
  ctx.font = `${Math.round(w / 18)}px sans-serif`;
  ctx.fillText(label.slice(0, 28), 20, h / 2 + t * 10);
}

async function makeImage(text, i) {
  const [w, h] = dims(text);
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  paint(c.getContext('2d'), w, h, `#${i + 1} ${text.split('\n').pop()}`);
  const blob = await new Promise((r) => c.toBlob(r, 'image/png'));
  return URL.createObjectURL(blob);
}

async function makeVideo(text) {
  const [w, h] = dims(text);
  const c = document.createElement('canvas');
  c.width = w / 2; c.height = h / 2;
  const ctx = c.getContext('2d');
  const rec = new MediaRecorder(c.captureStream(24), { mimeType: 'video/webm' });
  const parts = [];
  rec.ondataavailable = (e) => parts.push(e.data);
  rec.start();
  const t0 = performance.now();
  while (performance.now() - t0 < 1600) {
    paint(ctx, c.width, c.height, text.split('\n').pop(), (performance.now() - t0) / 1000);
    await sleep(40);
  }
  rec.stop();
  await new Promise((r) => (rec.onstop = r));
  return URL.createObjectURL(new Blob(parts, { type: 'video/webm' }));
}

function setBusy(on) {
  go.style.display = on ? 'none' : '';
  if (on && !stopBtn) {
    stopBtn = document.createElement('button');
    stopBtn.setAttribute('aria-label', 'Stop');
    stopBtn.textContent = 'Stop';
    go.after(stopBtn);
  } else if (!on && stopBtn) {
    stopBtn.remove();
    stopBtn = null;
  }
}

go.onclick = async () => {
  const text = composer.innerText.trim();
  if (!text) return;
  composer.textContent = '';
  const refs = attached.length;
  attached = []; chips.innerHTML = '';
  msg(text, 'user');
  setBusy(true);
  const thinking = msg('Thinking…');
  await sleep(/slow/.test(text) ? 4000 : 900);
  if (/approve/i.test(text)) {
    thinking.textContent = 'Here is my plan: generate the requested media.';
    const b = document.createElement('button');
    b.textContent = 'Approve';
    thinking.appendChild(b);
    await new Promise((r) => (b.onclick = r));
    b.remove();
  }
  thinking.textContent = 'Generating 0%';
  await sleep(600);
  if (/forbidden/.test(text)) { thinking.textContent = "I can't create that because it might violate our policies."; setBusy(false); return; }
  if (/ratelimit/.test(text)) { thinking.textContent = 'Too many requests. Please try again later.'; setBusy(false); return; }
  if (/unusual/.test(text)) { thinking.textContent = 'We noticed unusual activity on your account.'; setBusy(false); return; }
  if (/captcha/.test(text)) {
    const f = document.createElement('iframe');
    f.src = 'data:text/html,recaptcha/api2/bframe mock challenge';
    f.style.cssText = 'position:fixed;left:30%;top:20%;width:400px;height:500px;background:#fff';
    document.body.appendChild(f);
    setBusy(false);
    return;
  }
  if (/noimage/.test(text)) { thinking.textContent = 'Sure! Could you tell me more about the style you want?'; setBusy(false); return; }
  const asked = /Generate \d+ (images?|videos?)/i.exec(text)?.[1];
  const video = asked ? /video/i.test(asked) : /\bvideos?\b/i.test(text);
  const n = Number(/Generate (\d)/.exec(text)?.[1] ?? (video ? 1 : 2));
  thinking.textContent = `Generating 50%${refs ? ` (using ${refs} reference image${refs > 1 ? 's' : ''})` : ''}`;
  for (let i = 0; i < n; i++) {
    const url = video ? await makeVideo(text) : await makeImage(text, i);
    const el = document.createElement(video ? 'video' : 'img');
    el.src = url;
    if (video) { el.muted = true; el.controls = true; }
    thinking.appendChild(el);
    const g = el.cloneNode();
    grid.prepend(g);
    await sleep(300);
  }
  thinking.firstChild.textContent = `Done: ${n} ${video ? 'video' : 'image'}${n > 1 ? 's' : ''}.`;
  setBusy(false);
};
</script>
</body>
</html>
